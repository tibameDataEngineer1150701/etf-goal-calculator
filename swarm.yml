# VM 上的 ETF 排程。MySQL、RabbitMQ 已經在 stack「etf」、網路 etf_etf。
# 不要用 stack 名稱 etf 部署這個檔，否則會把資料庫服務換掉。
#
# 在 VM 上，先拉程式再從 Docker Hub 拉 image：
#   cd ~/etf-goal-calculator
#   git pull
#   sudo docker pull mark0403/etf-crawler:0.0.1
#   sudo docker stack deploy -c swarm.yml etf-jobs
#
# 週一到週五 15:00，scheduler 把 stock.etf_list 送到 twse / tpex。
# worker 從既有的 rabbitmq 領任務，寫進既有的 mysql。

version: "3.8"

services:
  worker_twse:
    image: mark0403/etf-crawler:0.0.1
    command: ["uv", "run", "celery", "-A", "etf_tasks", "worker", "--loglevel=info", "-Q", "twse", "--hostname=twse@%h"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass
      MYSQL_DB: etf
      ETF_LIST_DB: stock
      ETF_LIST_TABLE: etf_list
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: worker
      RABBITMQ_PASSWORD: worker
    networks:
      - etf_etf
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager

  worker_tpex:
    image: mark0403/etf-crawler:0.0.1
    command: ["uv", "run", "celery", "-A", "etf_tasks", "worker", "--loglevel=info", "-Q", "tpex", "--hostname=tpex@%h"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass
      MYSQL_DB: etf
      ETF_LIST_DB: stock
      ETF_LIST_TABLE: etf_list
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: worker
      RABBITMQ_PASSWORD: worker
    networks:
      - etf_etf
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager

  scheduler:
    image: mark0403/etf-crawler:0.0.1
    command: ["uv", "run", "python", "etf_scheduler.py"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass
      MYSQL_DB: etf
      ETF_LIST_DB: stock
      ETF_LIST_TABLE: etf_list
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: worker
      RABBITMQ_PASSWORD: worker
    networks:
      - etf_etf
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager

networks:
  etf_etf:
    external: true
