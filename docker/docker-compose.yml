# 一鍵起「MySQL + phpMyAdmin + 抓價入庫程式」
# 在專案根目錄執行：
#   docker compose -f docker/docker-compose.yml up --build
#   docker compose -f docker/docker-compose.yml down    # 加 -v 連資料一起刪
#
# 看資料：瀏覽器開 http://localhost:8080（帳號 root / 密碼 rootpass）
# MySQL 會自動載入 crawlers/etf/schema.sql 建表；crawler 會等 MySQL 健康後才開始寫入。

name: etf

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: etf
    ports:
      - "3306:3306"
    volumes:
      # 第一次啟動時自動執行，用來建表
      - ../crawlers/etf/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  crawler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # 若要改用 Docker Hub 上已 push 的 image，改成下面這行（並註解掉 build）：
    # image: your-dockerhub-account/etf-crawler:0.0.1
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass
      MYSQL_DB: etf
      # ETF_LIMIT: "15"              # 想先小量測試就把這行打開

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      PMA_USER: root
      PMA_PASSWORD: rootpass
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
